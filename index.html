<html lang="es">

<meta name="description" content="Curso de programación con Scratch para niños: misiones cortas, XP y medallas.">
<title>Liga de Creadores</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%231c7a45'/%3E%3Cpolygon points='16,9 22,13.5 19.7,20.5 12.3,20.5 10,13.5' fill='%23ffb400'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<style>
/* Concepto: una liga de fútbol. Cabecera de campo con líneas de cal, mapa de misiones como recorrido de temporada, bloques de Scratch con sus colores reales. */
:root {
  --bg: #eff4ec;
  --surface: #ffffff;
  --surface-2: #e3ebdf;
  --ink: #13261a;
  --muted: #536a5a;
  --line: #cddac9;
  --hero-bg: #1c7a45;
  --hero-ink: #ffffff;
  --pitch: #1c7a45;
  --pitch-ink: #ffffff;
  --accent: #ffb400;
  --accent-ink: #2a1c00;
  --bad: #b3261e;
  --lock: #8ea294;
  --b-motion: #2f6fd1;
  --b-looks: #7a4fd6;
  --b-sound: #b24bb2;
  --b-events: #f2b200;
  --b-control: #e08e0b;
  --b-sensing: #2a86ad;
  --b-operators: #38963a;
  --b-variables: #d96e00;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1b14;
    --surface: #162a1f;
    --surface-2: #1d3628;
    --ink: #e9f3ec;
    --muted: #9db5a4;
    --line: #2a4435;
    --hero-bg: #14502f;
    --pitch: #3fbf72;
    --pitch-ink: #08150d;
    --accent: #ffc233;
    --bad: #ff8a80;
    --lock: #587064;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1b14;
  --surface: #162a1f;
  --surface-2: #1d3628;
  --ink: #e9f3ec;
  --muted: #9db5a4;
  --line: #2a4435;
  --hero-bg: #14502f;
  --pitch: #3fbf72;
  --pitch-ink: #08150d;
  --accent: #ffc233;
  --bad: #ff8a80;
  --lock: #587064;
  color-scheme: dark;
}
html { color-scheme: light; }
* { box-sizing: border-box; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  margin: 0;
  padding-inline: 16px;
  padding-block: calc(20px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
}
#app { max-width: 720px; margin-inline: auto; display: flex; flex-direction: column; gap: 28px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--pitch); font-weight: 700; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.kicker { font-size: 0.75rem; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Cabecera de campo */
.hero { position: relative; background: var(--hero-bg); color: var(--hero-ink); border-radius: 8px; padding: 22px 20px 20px; overflow: hidden; display: flex; flex-direction: column; gap: 18px; }
.hero svg.pitch { position: absolute; inset: 0; width: 100%; height: 100%; color: #fff; opacity: 0.2; pointer-events: none; }
.hero > *:not(svg) { position: relative; }
.hero h1 { font-size: clamp(2rem, 8vw, 2.8rem); font-weight: 800; }
.hero .name-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.hero input[type="text"] { font: inherit; min-width: 0; flex: 1 1 160px; padding: 8px 12px; border-radius: 6px; border: 2px solid rgba(255,255,255,0.5); background: rgba(0,0,0,0.25); color: #fff; }
.hero input::placeholder { color: rgba(255,255,255,0.7); }
.btn { border: 0; border-radius: 6px; padding: 10px 18px; font-weight: 800; background: var(--accent); color: var(--accent-ink); }
.btn:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: 0.45; cursor: not-allowed; }
.btn.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.btn.green { background: var(--pitch); color: var(--pitch-ink); }
.stats { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 560px) { .stats { grid-template-columns: 1.4fr 1fr; } }
.xp-num { font-family: var(--font-display); font-weight: 800; font-size: 2.4rem; line-height: 1; font-variant-numeric: tabular-nums; }
.xp-num small { font-size: 1rem; font-weight: 600; opacity: 0.85; margin-left: 4px; }
.meter { height: 12px; background: rgba(0,0,0,0.3); border-radius: 99px; overflow: hidden; margin-block: 8px 6px; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.stat-note { font-size: 0.88rem; opacity: 0.92; }
.week { background: rgba(0,0,0,0.22); border-radius: 8px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.week b { font-family: var(--font-display); font-size: 1.7rem; font-variant-numeric: tabular-nums; line-height: 1.1; }

/* Secciones */
section { display: flex; flex-direction: column; gap: 14px; }
section > h2 { font-size: 1.35rem; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }

/* Reto del día */
.daily { display: flex; flex-direction: column; gap: 12px; }
.daily .q { font-size: 1.08rem; font-weight: 700; }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opt { background: var(--surface-2); border: 2px solid var(--line); border-radius: 6px; padding: 8px 16px; font-weight: 700; min-width: 64px; }
.opt:hover { border-color: var(--pitch); }
.daily .msg { font-weight: 700; }
.ok { color: var(--pitch); }
.no { color: var(--bad); }

/* Mapa */
ol.map { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; position: relative; }
ol.map::before { content: ""; position: absolute; left: 19px; top: 20px; bottom: 20px; border-left: 3px dashed var(--line); }
ol.map > li { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 14px; align-items: start; position: relative; }
.node { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; background: var(--surface); border: 3px solid var(--lock); color: var(--muted); }
.node svg { width: 20px; height: 20px; }
.st-open .node { border-color: var(--accent); color: var(--ink); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 30%, transparent); }
.st-done .node { background: var(--pitch); border-color: var(--pitch); color: var(--pitch-ink); }
.mcard { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; }
.st-open .mcard, .st-done .mcard { border-color: var(--pitch); }
.st-open .mcard:hover, .st-done .mcard:hover { background: var(--surface-2); }
.st-lock .mcard { cursor: default; opacity: 0.7; }
.mcard h3 { font-size: 1.15rem; }
.mcard .row { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.88rem; color: var(--muted); font-weight: 600; }
.pill { display: inline-block; font-size: 0.75rem; font-weight: 800; padding: 2px 9px; border-radius: 99px; background: var(--accent); color: var(--accent-ink); font-variant-numeric: tabular-nums; }
.pill.go { background: var(--pitch); color: var(--pitch-ink); }
.future { margin-top: 4px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.future div { border: 2px dashed var(--line); border-radius: 8px; padding: 10px 12px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.future b { color: var(--ink); font-family: var(--font-display); }
.future span { font-size: 0.85rem; }

/* Medallas y galería */
.medals { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.medal { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font-size: 0.85rem; }
.medal svg { width: 44px; height: 54px; }
.medal.off { opacity: 0.55; }
.medal b { font-family: var(--font-display); font-size: 0.95rem; }
ul.gallery { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
ul.gallery li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 6px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }

/* Misión */
.back { align-self: flex-start; }
.mhead { display: flex; flex-direction: column; gap: 10px; }
.mhead h1 { font-size: clamp(1.8rem, 7vw, 2.4rem); font-weight: 800; }
.mhead .goal { font-size: 1.12rem; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 0.82rem; font-weight: 700; padding: 3px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.steps label { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.steps input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--pitch); }
.steps li.on label { border-color: var(--pitch); background: color-mix(in srgb, var(--pitch) 10%, var(--surface)); }
.steps li.on .txt { color: var(--muted); }
.blk { display: inline-block; padding: 0 9px; margin-block: 1px; border-radius: 5px; color: #fff; font-weight: 800; font-size: 0.92em; line-height: 1.55; }
.b-motion { background: var(--b-motion); } .b-looks { background: var(--b-looks); } .b-sound { background: var(--b-sound); }
.b-events { background: var(--b-events); color: #2a1f00; } .b-control { background: var(--b-control); color: #2a1700; }
.b-sensing { background: var(--b-sensing); } .b-operators { background: var(--b-operators); } .b-variables { background: var(--b-variables); }
.progress { font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
details.help { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; }
details.help summary { cursor: pointer; font-weight: 800; }
details.help p { margin-top: 8px; }
.reto { display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 12px; align-items: start; border: 2px dashed var(--accent); border-radius: 8px; padding: 12px 14px; cursor: pointer; }
.reto input { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--pitch); }
.linkbox { display: flex; flex-direction: column; gap: 6px; }
.linkbox label { font-weight: 800; }
.linkbox input { font: inherit; width: 100%; min-width: 0; padding: 10px 12px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); }
.linkbox small { color: var(--muted); }
.win { background: var(--pitch); color: var(--pitch-ink); border-radius: 8px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.win h2 { font-size: 1.6rem; }
.win .btn { align-self: flex-start; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* Pie */
footer { display: flex; flex-direction: column; gap: 10px; border-top: 1px solid var(--line); padding-top: 16px; font-size: 0.9rem; }
footer .actions .btn { padding: 7px 14px; }
footer textarea { font: 0.8rem/1.4 ui-monospace, Menlo, Consolas, monospace; width: 100%; min-height: 90px; padding: 8px; border-radius: 6px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); word-break: break-all; }
.warn { background: color-mix(in srgb, var(--accent) 25%, var(--surface)); border: 1px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 0.9rem; }
.confetti { position: fixed; top: 0; left: 0; width: 10px; height: 14px; border-radius: 2px; pointer-events: none; z-index: 50; }
.acct { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 14px; font-size: 0.88rem; border-top: 1px solid rgba(255,255,255,0.25); padding-top: 12px; }
.acct span { min-width: 0; overflow-wrap: anywhere; }
.btn.sm { padding: 6px 12px; font-size: 0.88rem; }
form.login { display: flex; flex-direction: column; gap: 14px; }
form.login .msg { font-weight: 700; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

    { q: 'En ajedrez, el caballo está en x = 3, y = 3 y salta 2 casillas en x y 1 en y. ¿Dónde cae?', o: ['(5, 4)', '(4, 5)', '(5, 5)'], a: 0, why: 'x: 3 + 2 = 5 e y: 3 + 1 = 4. Así se calculan las posiciones en un tablero.' },

    { q: 'Quieres que el portero se mueva sin parar de lado a lado. ¿Qué bloque necesitas?', o: ['«detener todos»', '«por siempre»', '«decir hola»'], a: 1, why: '«por siempre» repite lo de dentro hasta que pares el juego.' },
    { q: 'Un juego empieza con 3 vidas y pierdes una cada vez que fallas. Fallas 2 veces. ¿Cuántas vidas quedan?', o: ['2', '1', '0'], a: 1, why: '3 - 2 = 1 vida. Las vidas son una variable.' }

  /* ---------- Utilidades ---------- */
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt(s) {
    return s.split(/(\{\w+\|[^}]+\})/).map(function (p) {

  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function weekIdx(d) {
    var days = Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 864e5);

  }
  function streakOf(weeks, now) {

  /* ---------- Estado ---------- */
  var storageOk = true;
  var state;
  function blank() { return { epoch: 0, name: '', steps: {}, done: {}, reto: {}, links: {}, daily: {}, weeks: [] }; }
  function normalize(o) {
    var b = blank();
    if (!o || typeof o !== 'object') o = {};
    if (typeof o.epoch === 'number' && isFinite(o.epoch) && o.epoch > 0) b.epoch = Math.floor(o.epoch);
    if (typeof o.name === 'string') b.name = o.name.slice(0, 24);
    MISSIONS.forEach(function (m) {
      var st = o.steps && o.steps[m.id];
      b.steps[m.id] = m.steps.map(function (_, i) { return !!(Array.isArray(st) && st[i]); });
      if (o.done && o.done[m.id] === true) b.done[m.id] = true;
      if (o.reto && o.reto[m.id] === true) b.reto[m.id] = true;
      var l = o.links && o.links[m.id];
      if (typeof l === 'string' && LINK_RE.test(l)) b.links[m.id] = l;
    });
    if (o.daily && typeof o.daily === 'object') {
      Object.keys(o.daily).forEach(function (k) { if (/^\d{4}-\d{2}-\d{2}$/.test(k) && o.daily[k] === true) b.daily[k] = true; });
    }

  function load() {

  function saveLocal() {

  /* ---------- Sincronización con Supabase ---------- */
  /* Fusión: gana el reinicio más reciente (epoch); si no hay reinicio, se une todo lo hecho en ambos lados. */
  function mergeStates(a, b) {
    if (a.epoch > b.epoch) return a;
    if (b.epoch > a.epoch) return b;
    var r = blank();
    r.epoch = a.epoch;
    r.name = b.name || a.name;
    MISSIONS.forEach(function (m) {
      r.steps[m.id] = m.steps.map(function (_, i) { return !!(a.steps[m.id][i] || b.steps[m.id][i]); });
      if (a.done[m.id] || b.done[m.id]) r.done[m.id] = true;
      if (a.reto[m.id] || b.reto[m.id]) r.reto[m.id] = true;
      var l = a.links[m.id] || b.links[m.id];
      if (l) r.links[m.id] = l;
    });
    Object.keys(a.daily).concat(Object.keys(b.daily)).forEach(function (k) { r.daily[k] = true; });
    r.weeks = Array.from(new Set(a.weeks.concat(b.weeks))).slice(-200);
    return r;
  }
  function syncText() {
    if (!sb || !session) return '';
    return syncState === 'ok' ? 'Sincronizado' : syncState === 'syncing' ? 'Sincronizando…' : syncState === 'offline' ? 'Sin conexión: se guarda aquí y se sincroniza después' : '';
  }
  function setSync(s) {
    syncState = s;
    var el = document.getElementById('syncnote');
    if (el) el.textContent = syncText();
  }
  var pushTimer = null;
  function schedulePush() {
    if (!sb || !session) return;
    clearTimeout(pushTimer);
    setSync('syncing');
    pushTimer = setTimeout(push, 700);
  }
  async function push() {
    if (!sb || !session) return;
    try {
      var r = await sb.from('liga_progress').upsert({ user_id: session.user.id, data: state, updated_at: new Date().toISOString() });
      if (r.error) throw r.error;
      setSync('ok');
    } catch (e) { setSync('offline'); }
  }
  async function pull() {
    if (!sb || !session) return;
    setSync('syncing');
    try {
      var uid = session.user.id, last = null;
      try { last = localStorage.getItem(KEY + '-uid'); } catch (e) {}
      if (last && last !== uid) state = normalize(null); // otra cuenta en este navegador: no mezclar progresos
      try { localStorage.setItem(KEY + '-uid', uid); } catch (e) {}
      var r = await sb.from('liga_progress').select('data').eq('user_id', uid).maybeSingle();
      if (r.error) throw r.error;
      var remote = normalize(r.data ? r.data.data : null);
      var merged = mergeStates(state, remote);
      var changedLocal = JSON.stringify(merged) !== JSON.stringify(state);
      state = merged;
      saveLocal();
      if (!r.data || JSON.stringify(merged) !== JSON.stringify(remote)) await push(); else setSync('ok');
      if (changedLocal) render();

  }
  function authErr(e) {
    var m = (e && e.message) || '';
    if (/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
    if (/already registered|already been registered/i.test(m)) return 'Ese correo ya tiene cuenta. Pulsa Entrar.';
    if (/not confirmed/i.test(m)) return 'Falta confirmar el correo. Mira tu bandeja de entrada.';
    if (/rate limit|too many/i.test(m)) return 'Demasiados intentos. Espera un poco y vuelve a probar.';
    if (/password/i.test(m)) return 'La contraseña no vale. Prueba con otra más larga.';
    return 'No se pudo completar. Inténtalo de nuevo.';
  }
  async function doAuth(kind) {
    var email = ((document.getElementById('lm') || {}).value || '').trim();

    if (!email || pw.length < 8) { loginMsg = 'Escribe tu correo y una contraseña de al menos 8 caracteres.'; render(); return; }
    loginBusy = true;
    loginMsg = kind === 'in' ? 'Entrando…' : 'Creando la cuenta…';
    render();
    try {
      var r = kind === 'in'
        ? await sb.auth.signInWithPassword({ email: email, password: pw })
        : await sb.auth.signUp({ email: email, password: pw });
      if (r.error) throw r.error;
      if (r.data && r.data.session) { loginMsg = ''; view = 'map'; }
      else loginMsg = 'Cuenta creada. Revisa tu correo para confirmarla y luego pulsa Entrar.';
    } catch (e) { loginMsg = authErr(e); }
    loginBusy = false;
    render();
  }
  function xp() {

  }

      '<details class="help"><summary>Si no funciona</summary><p>' + esc(m.fail) + '</p></details>' +
      '<label class="reto"><input type="checkbox" data-act="reto" data-id="' + id + '" data-fid="rt"' + (state.reto[id] ? ' checked' : '') + '><span><b>Reto extra (opcional, +' + RETO_XP + ' XP)</b><br>' + fmt(m.reto) + '</span></label>' +
      '<div class="linkbox"><label for="lk">Enlace de tu juego compartido (opcional)</label><input id="lk" data-fid="lk" data-act="link" data-id="' + id + '" type="url" inputmode="url" placeholder="https://scratch.mit.edu/projects/123456789/" value="' + esc(link) + '" autocomplete="off"><small>' + esc(linkMsg[id] || 'Cuando compartas el juego en Scratch, copia el enlace aquí y saldrá en tu galería.') + '</small></div>' +
      finish;
  }

  function render() {
    var a = document.activeElement;
    var fid = a && a.dataset ? a.dataset.fid : null;
    app.innerHTML = view === 'map' ? mapHTML() : view === 'login' ? loginHTML() : missionHTML(view);
    if (fid) { var el = app.querySelector('[data-fid="' + fid + '"]'); if (el && !el.disabled) el.focus({ preventScroll: true }); }
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var cols = ['--accent', '--pitch', '--b-motion', '--b-looks', '--b-sound'];
    for (var i = 0; i < 28; i++) {
      var s = document.createElement('i');
      s.className = 'confetti';
      s.style.background = 'var(' + cols[i % cols.length] + ')';
      s.style.left = (30 + Math.random() * 40) + 'vw';
      s.style.top = '35vh';
      document.body.appendChild(s);
      var dx = (Math.random() - 0.5) * 360, dy = 140 + Math.random() * 260, r = Math.random() * 720;
      var anim = s.animate([
        { transform: 'translate(0,0) rotate(0)', opacity: 1 },
        { transform: 'translate(' + dx + 'px,' + dy + 'px) rotate(' + r + 'deg)', opacity: 0 }
      ], { duration: 1100 + Math.random() * 500, easing: 'cubic-bezier(.2,.7,.4,1)' });
      anim.onfinish = (function (n) { return function () { n.remove(); }; })(s);
    }
  }

  /* ---------- Acciones ---------- */
  app.addEventListener('click', function (e) {
    var t = e.target.closest('[data-act]');
    if (!t || t.tagName === 'INPUT') return;
    var act = t.dataset.act, id = t.dataset.id;
    if (act === 'open') { view = id; justDone = null; render(); window.scrollTo(0, 0); }
    else if (act === 'back') { view = 'map'; justDone = null; render(); window.scrollTo(0, 0); }
    else if (act === 'complete') {
      var m = mById(view);
      if (m && !state.done[m.id] && allSteps(m)) {
        state.done[m.id] = true; addWeek(); save(); justDone = m.id; render(); window.scrollTo(0, 0); confetti();
      }
    }
    else if (act === 'daily') {
      var days = Math.floor(Date.UTC(new Date().getFullYear(), new Date().getMonth(), new Date().getDate()) / 864e5);
      var d = DAILY[days % DAILY.length];
      if (Number(t.dataset.i) === d.a) { state.daily[todayKey()] = true; addWeek(); save(); dailyMsg = null; confetti(); }
      else { dailyMsg = 'Casi. Piénsalo otra vez y prueba con otra respuesta.'; }
      render();
    }
    else if (act === 'bk-show') { showBackup = true; backupMsg = ''; backupText = btoa(unescape(encodeURIComponent(JSON.stringify(state)))); render(); }
    else if (act === 'bk-hide') { showBackup = false; render(); }
    else if (act === 'bk-load') {
      var raw = (document.getElementById('bk') || {}).value || '';
      try {
        var obj = JSON.parse(decodeURIComponent(escape(atob(raw.trim()))));
        state = normalize(obj); save(); backupText = raw.trim(); backupMsg = 'Progreso cargado.';
      } catch (err) { backupMsg = 'Ese código no es válido. Copia el código completo.'; }
      render();
    }
    else if (act === 'reset') {
      if (resetArm) { state = normalize(null); state.epoch = Date.now(); save(); resetArm = false; showBackup = false; drafts = {}; view = 'map'; }
      else { resetArm = true; }
      render();
    }
    else if (act === 'reset-cancel') { resetArm = false; render(); }
    else if (act === 'login-open') { loginMsg = ''; view = 'login'; render(); window.scrollTo(0, 0); }
    else if (act === 'signup') { if (sb && !loginBusy) doAuth('up'); }
    else if (act === 'logout') { if (sb) sb.auth.signOut(); }
  });

  app.addEventListener('change', function (e) {
    var t = e.target;
    if (!t.dataset || !t.dataset.act) return;
    if (t.dataset.act === 'step') {
      state.steps[t.dataset.id][Number(t.dataset.i)] = t.checked; save(); render();
    } else if (t.dataset.act === 'reto') {
      state.reto[t.dataset.id] = t.checked; save(); render();
    } else if (t.dataset.act === 'link') {
      var v = t.value.trim(), id = t.dataset.id;
      if (!v) { delete state.links[id]; delete drafts[id]; linkMsg[id] = 'Enlace borrado.'; }
      else if (LINK_RE.test(v)) { state.links[id] = v; delete drafts[id]; linkMsg[id] = 'Guardado. Aparece en tu galería.'; }
      else { drafts[id] = v; linkMsg[id] = 'El enlace tiene que ser como https://scratch.mit.edu/projects/123456789/'; }
      save(); render();
    }
  });

  app.addEventListener('submit', function (e) {
    if (e.target.dataset && e.target.dataset.form === 'login') {
      e.preventDefault();
      if (sb && !loginBusy) doAuth('in');
      return;
    }
    if (e.target.dataset && e.target.dataset.form === 'name') {
      e.preventDefault();
      var v = (document.getElementById('nm').value || '').trim().slice(0, 24);
      if (v) { state.name = v; save(); render(); }
    }
  });

  state = load();
  render();

  if (sb) {
    sb.auth.onAuthStateChange(function (ev, s) {
      var before = session ? session.user.id : null;
      session = s;
      var now = s ? s.user.id : null;
      if (!s) syncState = 'local';
      if (now && (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION')) setTimeout(pull, 0);
      if (before !== now) render();
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden && session) pull(); });
    window.addEventListener('online', function () { if (session) pull(); });
  }
})();
</script>
</body>
</html>
